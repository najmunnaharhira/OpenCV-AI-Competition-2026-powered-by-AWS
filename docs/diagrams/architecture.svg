<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" font-family="DejaVu Sans, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker>
  </defs>
  <rect width="1200" height="640" fill="#fff"/>
  <text x="600" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#111">InspectAgent architecture: OpenCV 5 + AWS</text>

  <!-- left: users and cell -->
  <rect x="30" y="90" width="190" height="80" rx="10" fill="#f2f2f2" stroke="#666"/>
  <text x="125" y="125" text-anchor="middle" font-size="15" font-weight="bold">Judge / operator</text>
  <text x="125" y="147" text-anchor="middle" font-size="13">web browser</text>

  <rect x="30" y="420" width="190" height="110" rx="10" fill="#f2f2f2" stroke="#666"/>
  <text x="125" y="452" text-anchor="middle" font-size="15" font-weight="bold">Inspection cell</text>
  <text x="125" y="474" text-anchor="middle" font-size="12">camera: focus, exposure,</text>
  <text x="125" y="491" text-anchor="middle" font-size="12">polarizer (simulated now,</text>
  <text x="125" y="508" text-anchor="middle" font-size="12">real camera later)</text>

  <!-- AWS cloud -->
  <rect x="270" y="60" width="910" height="560" rx="14" fill="#fff8ef" stroke="#e08a00" stroke-width="2"/>
  <text x="290" y="88" font-size="16" font-weight="bold" fill="#b36b00">AWS account (one SAM template)</text>

  <rect x="300" y="105" width="170" height="60" rx="8" fill="#fff" stroke="#e08a00"/>
  <text x="385" y="131" text-anchor="middle" font-size="14" font-weight="bold">Lambda Function URL</text>
  <text x="385" y="151" text-anchor="middle" font-size="12">HTTPS endpoint</text>

  <!-- Lambda box -->
  <rect x="300" y="200" width="520" height="390" rx="10" fill="#fff" stroke="#e08a00" stroke-width="2"/>
  <text x="315" y="226" font-size="15" font-weight="bold" fill="#b36b00">AWS Lambda container, arm64 (Graviton)</text>

  <rect x="325" y="245" width="470" height="50" rx="6" fill="#eef3ff" stroke="#3561c9"/>
  <text x="560" y="275" text-anchor="middle" font-size="13">FastAPI + Mangum: /inspect, /approvals, judge UI</text>

  <rect x="325" y="315" width="470" height="85" rx="6" fill="#f3eefe" stroke="#7a4cc9"/>
  <text x="560" y="340" text-anchor="middle" font-size="14" font-weight="bold">Agent executor</text>
  <text x="560" y="360" text-anchor="middle" font-size="12">planner: rules or Claude (Bedrock) · guardrails ·</text>
  <text x="560" y="378" text-anchor="middle" font-size="12">capture/step budgets · fallback · trace</text>

  <rect x="325" y="420" width="470" height="150" rx="6" fill="#ecf8ef" stroke="#2d8a4a" stroke-width="2"/>
  <text x="560" y="445" text-anchor="middle" font-size="14" font-weight="bold">OpenCV 5 tools (opencv-python-headless 5.0.0)</text>
  <text x="340" y="470" font-size="12">• quality gate: Laplacian variance, intensity stats, saturation</text>
  <text x="340" y="490" font-size="12">• align: ORB + RANSAC similarity + ECC refinement</text>
  <text x="340" y="510" font-size="12">• tolerant residual: morphological min/max envelope</text>
  <text x="340" y="530" font-size="12">• detect: threshold, open/close, connected components</text>
  <text x="340" y="550" font-size="12">• close-up re-inspection, annotation   [COOL: same calls]</text>

  <!-- right services -->
  <rect x="880" y="200" width="270" height="70" rx="8" fill="#fff" stroke="#3561c9"/>
  <text x="1015" y="228" text-anchor="middle" font-size="14" font-weight="bold">Amazon Bedrock</text>
  <text x="1015" y="250" text-anchor="middle" font-size="12">Claude planner (tool use)</text>

  <rect x="880" y="295" width="270" height="70" rx="8" fill="#fff" stroke="#2d8a4a"/>
  <text x="1015" y="323" text-anchor="middle" font-size="14" font-weight="bold">Amazon S3</text>
  <text x="1015" y="345" text-anchor="middle" font-size="12">traces + evidence images</text>

  <rect x="880" y="390" width="270" height="70" rx="8" fill="#fff" stroke="#3561c9"/>
  <text x="1015" y="418" text-anchor="middle" font-size="14" font-weight="bold">Amazon DynamoDB</text>
  <text x="1015" y="440" text-anchor="middle" font-size="12">human-approval queue</text>

  <rect x="880" y="485" width="270" height="50" rx="8" fill="#fff" stroke="#c9356b"/>
  <text x="1015" y="515" text-anchor="middle" font-size="14" font-weight="bold">Amazon SNS → approver email</text>

  <rect x="880" y="550" width="270" height="50" rx="8" fill="#fff" stroke="#777"/>
  <text x="1015" y="580" text-anchor="middle" font-size="13">CloudWatch Logs + X-Ray</text>

  <!-- arrows -->
  <line x1="220" y1="130" x2="298" y2="135" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
  <line x1="385" y1="165" x2="385" y2="198" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
  <line x1="323" y1="490" x2="222" y2="475" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
  <text x="228" y="462" font-size="11" fill="#333">capture(settings)</text>
  <line x1="797" y1="345" x2="878" y2="240" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
  <text x="836" y="190" font-size="11" fill="#333">tools + observations</text>
  <line x1="797" y1="360" x2="878" y2="330" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
  <line x1="797" y1="375" x2="878" y2="420" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
  <line x1="1015" y1="460" x2="1015" y2="483" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
  <line x1="820" y1="575" x2="878" y2="575" stroke="#777" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#a)"/>
  <line x1="560" y1="295" x2="560" y2="313" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
  <line x1="560" y1="400" x2="560" y2="418" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
</svg>
